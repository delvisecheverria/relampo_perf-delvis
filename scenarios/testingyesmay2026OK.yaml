data_source:
    mode: sequential
    name: Data Source
    path: relampo_users_500.csv
    type: csv
    variable_names: email,pass
http_defaults:
    base_url: http://testingyes.com
    follow_redirects: false
    headers:
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: en-US,en;q=0.9
        Priority: u=0, i
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:150.0) Gecko/20100101 Firefox/150.0
scenarios:
    - cookies:
        mode: auto
      load:
        __relampo_duration_override_iteration_total: 1
        duration: 2m
        ramp_up: 2m
        type: constant
        users: "100"
      name: Recorded Scenario
      steps:
        - request:
            enabled: true
            extractors:
                - capture_mode: first
                  default: Regex value not found
                  from: body
                  group: 1
                  match_no: 1
                  pattern: (?is)(?:var|let|const)\s+securityToken\s*=\s*["']([^"']+)["']
                  template: $1$
                  type: regex
                  var: securityToken
                  variable: securityToken
            headers:
                Connection: keep-alive
                Cookie: zenid=ae27b31411baf184320ab5c811b1f73d; ceid=13978376f353ee13f67a188045c6df47
